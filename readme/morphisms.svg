<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c11"/><stop offset="1" stop-color="#070709"/>
    </linearGradient>
    <filter id="neu" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#33343f" flood-opacity="0.55"/>
      <feDropShadow dx="4" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="6" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20141a"/><stop offset="1" stop-color="#0f0d12"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4b52"/><stop offset="0.12" stop-color="#33343a"/>
      <stop offset="0.55" stop-color="#191a1f"/><stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/><stop offset="0.3" stop-color="#7a1414"/>
      <stop offset="0.55" stop-color="#3a2c8f"/><stop offset="0.8" stop-color="#1f8a70"/>
      <stop offset="1" stop-color="#ff9d3b"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c4"><rect x="0" y="0" width="140" height="150" rx="20"/></clipPath>
    <clipPath id="c5"><rect x="0" y="0" width="140" height="150" rx="20"/></clipPath>
    <clipPath id="c6"><rect x="0" y="0" width="140" height="150" rx="26"/></clipPath>
    <style>
      .lab{ fill:#ece7de; font-size:11px; font-weight:700; letter-spacing:1.4px; text-anchor:middle; }
      .sub{ fill:#8b867c; font-size:8px; letter-spacing:1px; text-anchor:middle; font-family:monospace; }
    </style>
  </defs>

  <rect width="960" height="260" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="959" height="259" rx="18" fill="none" stroke="#ece7de" stroke-opacity="0.08"/>

  <!-- 1 NEUMORPHISM : sliding toggle -->
  <g transform="translate(30,26)">
    <rect width="140" height="150" rx="20" fill="#131319"/>
    <rect x="26" y="60" width="88" height="30" rx="15" fill="#131319" filter="url(#neu)"/>
    <circle cx="41" cy="75" r="11" fill="#e6e2d8">
      <animate attributeName="cx" values="41;99;41" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
      <animate attributeName="fill" values="#8b867c;#ff3b3b;#8b867c" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
    </circle>
    <text class="lab" x="70" y="140">NEUMORPHISM</text>
  </g>

  <!-- 2 GLASSMORPHISM : frosted panel + sheen -->
  <g transform="translate(185,26)">
    <rect width="140" height="150" rx="20" fill="#0e0e14"/>
    <g clip-path="url(#c4)">
      <circle cx="35" cy="55" r="34" fill="#ff3b3b" filter="url(#blur)" opacity="0.8"/>
      <circle cx="110" cy="110" r="30" fill="#3a2c8f" filter="url(#blur)" opacity="0.8"/>
      <rect x="20" y="38" width="100" height="74" rx="14" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22"/>
      <rect x="24" y="42" width="92" height="2" rx="1" fill="#fff" fill-opacity="0.4"/>
      <rect x="-40" y="38" width="34" height="74" fill="url(#sheen)" transform="skewX(-16)">
        <animate attributeName="x" values="-40;150" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text class="lab" x="70" y="140">GLASSMORPHISM</text>
  </g>

  <!-- 3 CLAYMORPHISM : puffy squish -->
  <g transform="translate(340,26)">
    <rect width="140" height="150" rx="20" fill="#0d0d12"/>
    <g transform="translate(70,75)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1.05 0.9;1 1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
        <rect x="-40" y="-34" width="80" height="68" rx="26" fill="url(#clay)" filter="url(#soft)"/>
        <ellipse cx="0" cy="-16" rx="30" ry="12" fill="#ff5050" opacity="0.18"/>
        <circle cx="0" cy="4" r="12" fill="#ff3b3b" opacity="0.9"/>
      </g>
    </g>
    <text class="lab" x="70" y="140">CLAYMORPHISM</text>
  </g>

  <!-- 4 SKEUOMORPHISM : brushed metal + shine -->
  <g transform="translate(495,26)">
    <rect width="140" height="150" rx="20" fill="#0c0c10"/>
    <g clip-path="url(#c4)">
      <rect x="20" y="46" width="100" height="58" rx="12" fill="url(#metal)"/>
      <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
        <line x1="26" y1="46" x2="26" y2="104"/><line x1="34" y1="46" x2="34" y2="104"/><line x1="42" y1="46" x2="42" y2="104"/>
        <line x1="50" y1="46" x2="50" y2="104"/><line x1="58" y1="46" x2="58" y2="104"/><line x1="66" y1="46" x2="66" y2="104"/>
        <line x1="74" y1="46" x2="74" y2="104"/><line x1="82" y1="46" x2="82" y2="104"/><line x1="90" y1="46" x2="90" y2="104"/>
        <line x1="98" y1="46" x2="98" y2="104"/><line x1="106" y1="46" x2="106" y2="104"/><line x1="114" y1="46" x2="114" y2="104"/>
      </g>
      <rect x="20" y="46" width="100" height="2" fill="#fff" fill-opacity="0.18"/>
      <circle cx="70" cy="75" r="15" fill="#1c1d22" stroke="#000" stroke-opacity="0.6"/>
      <circle cx="70" cy="75" r="15" fill="none" stroke="#fff" stroke-opacity="0.14"/>
      <circle cx="66" cy="71" r="4" fill="#fff" fill-opacity="0.25"/>
      <rect x="-40" y="46" width="26" height="58" fill="url(#sheen)" transform="skewX(-14)" opacity="0.7">
        <animate attributeName="x" values="-40;150" dur="4.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text class="lab" x="70" y="140">SKEUOMORPHISM</text>
  </g>

  <!-- 5 AURORAMORPHISM : flowing gradient -->
  <g transform="translate(650,26)">
    <rect width="140" height="150" rx="20" fill="#0a0a0f"/>
    <g clip-path="url(#c5)">
      <g transform="translate(70,75)">
        <rect x="-120" y="-120" width="240" height="240" fill="url(#aurora)" opacity="0.85">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        </rect>
      </g>
      <rect x="10" y="10" width="120" height="130" rx="14" fill="#07070a" fill-opacity="0.55"/>
    </g>
    <rect x="10" y="10" width="120" height="130" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <text class="lab" x="70" y="140">AURORAMORPHISM</text>
  </g>

  <!-- 6 LIQUID GLASS : refractive sheen -->
  <g transform="translate(805,26)">
    <rect width="140" height="150" rx="20" fill="#0e0e14"/>
    <g clip-path="url(#c6)">
      <circle cx="40" cy="50" r="30" fill="#ff3b3b" filter="url(#blur)" opacity="0.5"/>
      <circle cx="104" cy="112" r="26" fill="#1f8a70" filter="url(#blur)" opacity="0.5"/>
      <rect x="22" y="44" width="96" height="62" rx="20" fill="url(#liquid)" stroke="#ffffff" stroke-opacity="0.3"/>
      <rect x="26" y="48" width="88" height="3" rx="1.5" fill="#fff" fill-opacity="0.5"/>
      <rect x="-40" y="44" width="30" height="62" fill="url(#sheen)" transform="skewX(-18)">
        <animate attributeName="x" values="-40;150" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text class="lab" x="70" y="140">LIQUID GLASS</text>
  </g>
</svg>
