    <clipPath id="sw"><rect x="0" y="0" width="132" height="78" rx="12"/></clipPath>
  </defs>
  <rect width="960" height="150" rx="16" fill="#0b0b0f"/>
  <rect x="0.5" y="0.5" width="959" height="149" rx="16" fill="none" stroke="#ece7de" stroke-opacity="0.08"/>

  <!-- swatches: cream, ink, panel, red, deep red, green, blue-black -->
