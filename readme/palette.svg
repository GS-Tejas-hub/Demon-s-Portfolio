    <g transform="translate(290,26)"><g clip-path="url(#sw)"><rect width="132" height="78" fill="#0d0d0f" stroke="#1c1c22"/><rect x="-40" y="0" width="34" height="78" fill="url(#shine)" transform="skewX(-16)"><animate attributeName="x" values="-40;150" dur="4s" begin="1s" repeatCount="indefinite"/></rect></g><text x="8" y="98" fill="#ece7de" font-size="11" font-weight="700">Panel</text><text x="8" y="112" fill="#8b867c" font-size="9" font-family="monospace">#0D0D0F</text></g>
    <g transform="translate(423,26)"><g clip-path="url(#sw)"><rect width="132" height="78" fill="#ff3b3b"/><rect x="-40" y="0" width="34" height="78" fill="url(#shine)" transform="skewX(-16)"><animate attributeName="x" values="-40;150" dur="4s" begin="1.5s" repeatCount="indefinite"/></rect></g><text x="8" y="98" fill="#ece7de" font-size="11" font-weight="700">Accent</text><text x="8" y="112" fill="#8b867c" font-size="9" font-family="monospace">#FF3B3B</text></g>
    <g transform="translate(556,26)"><g clip-path="url(#sw)"><rect width="132" height="78" fill="#7a1414"/><rect x="-40" y="0" width="34" height="78" fill="url(#shine)" transform="skewX(-16)"><animate attributeName="x" values="-40;150" dur="4s" begin="2s" repeatCount="indefinite"/></rect></g><text x="8" y="98" fill="#ece7de" font-size="11" font-weight="700">Deep red</text><text x="8" y="112" fill="#8b867c" font-size="9" font-family="monospace">#7A1414</text></g>
    <g transform="translate(689,26)"><g clip-path="url(#sw)"><rect width="132" height="78" fill="#6ee787"/><rect x="-40" y="0" width="34" height="78" fill="url(#shine)" transform="skewX(-16)"><animate attributeName="x" values="-40;150" dur="4s" begin="2.5s" repeatCount="indefinite"/></rect></g><text x="8" y="98" fill="#ece7de" font-size="11" font-weight="700">Signal</text><text x="8" y="112" fill="#8b867c" font-size="9" font-family="monospace">#6EE787</text></g>
    <g transform="translate(822,26)"><g clip-path="url(#sw)"><rect width="132" height="78" fill="#0E1016" stroke="#1c1c22"/><rect x="-40" y="0" width="34" height="78" fill="url(#shine)" transform="skewX(-16)"><animate attributeName="x" values="-40;150" dur="4s" begin="3s" repeatCount="indefinite"/></rect></g><text x="8" y="98" fill="#ece7de" font-size="11" font-weight="700">Tint</text><text x="8" y="112" fill="#8b867c" font-size="9" font-family="monospace">#0E1016</text></g>
