<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glowR"><stop offset="0" stop-color="#ff3b3b" stop-opacity="0.55"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#3a2c8f" stop-opacity="0.45"/><stop offset="1" stop-color="#3a2c8f" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowG"><stop offset="0" stop-color="#1f8a70" stop-opacity="0.35"/><stop offset="1" stop-color="#1f8a70" stop-opacity="0"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3b3b" stop-opacity="0"/><stop offset="0.5" stop-color="#ff3b3b"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="960" height="220" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="220" fill="#070709"/>
    <circle cx="230" cy="70" r="220" fill="url(#glowR)"><animate attributeName="cx" values="230;330;230" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="70;120;70" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="160" r="230" fill="url(#glowB)"><animate attributeName="cx" values="760;660;760" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="30" r="180" fill="url(#glowG)"><animate attributeName="cy" values="30;90;30" dur="20s" repeatCount="indefinite"/></circle>
    <rect width="960" height="220" filter="url(#grain)"/>

    <!-- scanning line -->
    <rect x="0" y="0" width="960" height="2" fill="url(#line)" opacity="0.7">
      <animate attributeName="y" values="20;200;20" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- HUD corners -->
    <g stroke="#ece7de" stroke-opacity="0.35" stroke-width="2" fill="none">
      <path d="M24 24 h34 M24 24 v34"/><path d="M936 24 h-34 M936 24 v34"/>
      <path d="M24 196 h34 M24 196 v-34"/><path d="M936 196 h-34 M936 196 v-34"/>
    </g>

    <text x="480" y="100" text-anchor="middle" fill="#ece7de" font-size="62" font-weight="800" letter-spacing="4" font-style="italic">GS.TEJAS</text>
    <text x="480" y="140" text-anchor="middle" fill="#8b867c" font-size="13" letter-spacing="7" font-family="monospace">FULL STACK &#215; AI / ML &#215; FOUNDER</text>
    <text x="480" y="170" text-anchor="middle" fill="#ff3b3b" font-size="10" letter-spacing="4" font-family="monospace" opacity="0.85">
      A PORTFOLIO BUILT AT 5 AM
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="0.5" y="0.5" width="959" height="219" rx="16" fill="none" stroke="#ece7de" stroke-opacity="0.1"/>
</svg>
